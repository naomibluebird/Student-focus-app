<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ CRITICAL: Makes mobile responsiveness work -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / Browser theme color (matches StudyBloom purple) -->
    <meta name="theme-color" content="#7c5cff" />

    <!-- App description (good for SEO when you deploy) -->
    <meta name="description" content="StudyBloom — Your personal student productivity dashboard. Manage tasks, schedule, deadlines and focus sessions." />

    <!-- Tab title -->
    <title>StudyBloom</title>

    <!-- Preconnect to Google Fonts for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- No JavaScript fallback message -->
    <noscript>You need to enable JavaScript to run StudyBloom.</noscript>

    <!-- React mounts here -->
    <div id="root"></div>
  </body>
</html>
